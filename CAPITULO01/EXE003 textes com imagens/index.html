<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textes com Imagens</title>
</head>
<body>
    <h1>Testando carga de Imargem</h1>
    <p>Você vai ver a imargem que está na mesma pasta</p>
    <img src="html5-logo.png" alt="logo html5"><!--imagem local servi para leitores de tela-->
    <img src="CSS3_logo.webp" alt="logocss3.webp"><!--imagem local-->
    <img src="javascript.png" alt="logo JavaScript"><!--imagem local-->
    <P>Podemos carregar imargens que estão em Subpastas</P> <!--imagem externa-->
    <img src="Imargen/javascript1.jpeg" alt="logo javascript"><!--imagem externa-->      
    <img src="Imargen/CSS3_logo1.webp" alt="logo css3"> <!--imagem externa-->
    <p>Também podemos carregar imagens de URLs e externas (Subpasta)</p>
    <img src="https://t3.ftcdn.net/jpg/05/15/64/02/360_F_515640231_XLCISv1i3BzrmmpQrzEk5DOVpfLhQ0W5.jpg" alt="logo javascript"> <!--URLs (um link único da internet)-->
    <img src="Imargen/LogoJavaScript.jpg" alt="Logo Java Script"><!--imagem externa diminuiu a resolução pelo GIMP-->
</body>
</html>
