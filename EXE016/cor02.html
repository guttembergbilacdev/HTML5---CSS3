<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gradiente em CSS</title>
    <style>
        * {  /* Configurações Globais do CSS */
           
         right: auto;x; /* Define a margem direita como automática */
            left: auto; /* Define a margem esquerda como automática */
            margin-right: auto; /* Define a margem direita como automática */
            margin-left: auto; /* Define a margem esquerda como automática */
            padding: 0; /* Remove o preenchimento interno */
            box-sizing: border-box; /* Inclui o preenchimento e a borda no tamanho total do elemento */
        }
        body {
            background-image: linear-gradient(to right, #2B3542, #88FFD3, #BA5840, #CCC1BF, #056C5C); /* Gradiente linear da esquerda para a direita com cores azul, rosa, roxo, amarelo e laranja */
            background-attachment: fixed; /* Mantém o fundo fixo durante a rolagem */
          
        }
    </style>
</head>
<body>
    <h1>Testando Gradientes</h1>
</body>
</html>
