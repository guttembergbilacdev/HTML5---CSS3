<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body
            {
                font-family: Arial, Helvetica, sans-serif;
                
            }

        table
            {
                border-collapse: collapse;
                width: 300px;
            }

            td, th{
                border: 1px solid #000;
                padding: 10px;
                text-align: center;
            }
    </style>

 <body>
    <h1>Desafio de Tabelas 1</h1>

    <table>
        <tr>
            <td colspan="6">A</td>
            <td rowspan="4">B</td>
        </tr>
        <tr>
            
            <td rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
           
        </tr>
        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>
        <tr>
            <td colspan="7">N</td>
        </tr>
    </table>
 </body>
 

</html>
