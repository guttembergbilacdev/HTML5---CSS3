<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
                
                font-family: Arial, sans-serif;
            }

        table{
            width: 400px;
            border-collapse: collapse;
            
        }

        tr.linha {
            background-color: gray;
        }

        td{
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
       
        td.dados {
            background-color: yellow;
            padding: 8px;
        }
    </style>
    
    


    <I--
    HIRAQUIA DE TABELAS (Simples, Complexas e Aninhadas)
        TABLE 
            TR (Table Row) - Linha da Tabela
                TH (Table Header) - Cabeçalho da Tabela
                TD (Table Data) - Dados da Tabela
-->            
</head>
<body>
    <h1>Minha Primeira Tabela</h1>

    <table>
        <table>
            <tr> <!-- PRIMEIRA Linha da Tabela -->
                <td>A1</td>
                <td>B1</td>
                <td>C1</td>
            </tr>
            <tr class="linha"> <!-- SEGUNDA Linha da Tabela -->
                <td>A2</td>
                <td>B2</td>
                <td>C2</td>
            </tr>
            <tr> <!-- TERCEIRA Linha da Tabela -->
                <td>A3</td>
                <td>B3</td>
                <td>C3</td>
            </tr>
            <tr> <!-- QUARTA Linha da Tabela -->
                <td>A4</td>
                <td class="dados">B4</td>
                <td>C4</td>
            </tr>
            <tr>
                <td>A5</td>
                <td>B5</td>
            </tr>
            <tr>
                <td>A6</td>
                
            </tr>
        </table>
    </table>
</body>
</html>
