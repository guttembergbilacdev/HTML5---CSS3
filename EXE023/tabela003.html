<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
                
                font-family: Arial, sans-serif;
            }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            
        }

        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;/* Alinhamento horizontal */
            vertical-align: middle; /* Alinhamento vertical */
        }

        .numero{
            text-align: right; /* Alinhamento horizontal à direita */
        }
       
        
    </style>
    
    


    <I--
    HIRAQUIA DE TABELAS (Simples, Complexas e Aninhadas)
        TABLE 
            TR (Table Row) - Linha da Tabela
                TH (Table Header) - Cabeçalho da Tabela
                TD (Table Data) - Dados da Tabela
-->            
</head>
<body>
    <h1>Minha Primeira Tabela</h1>

    <table>
        <table>
            <tr> <!-- PRIMEIRA Linha da Tabela -->
                <td>A1</td>
                <td>B1</td>
                <td>C1</td>
            </tr>
            <tr > <!-- SEGUNDA Linha da Tabela -->
                <td>A2</td>
                <td>B2</td>
                <td class="numero">C2</td>
            </tr>
            <tr> <!-- TERCEIRA Linha da Tabela -->
                <td>A3</td>
                <td>B3</td>
                <td class="numero">C3</td>
            </tr>
            <tr> <!-- QUARTA Linha da Tabela -->
                <td>A4</td>
                <td >B4</td>
                <td>C4</td>
            </tr>
           
        </table>
    </table>
</body>
</html>
