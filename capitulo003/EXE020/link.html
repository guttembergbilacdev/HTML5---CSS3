<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        body{

        font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: rgb(3, 139, 3);
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: green;
            
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        a:active{
            color: rgb(112, 190, 10);
        }
        .espercial{
            background-color: rgb(95, 255, 47);
            color: white;
        }
        .espercial::before{ /* antes  */
            content: '→';
            text-decoration: none;
            font-weight: normal;
            color: rgb(94, 90, 90)
        }       
        .espercial::after{  /* depois  */
            content: '←';
            text-decoration: none;
            font-weight: normal;
            color: rgb(56, 54, 54);
        }

    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://yuotube.com/cursoemvideo/" target="_blank" class = "espercial">Canal do youtube</a></li>
        <li><a href="https://www.cursoemvideio.com" target="_blank" class="espercial">Side curso em video</a></li>

    </ul>
</body>
</html>
