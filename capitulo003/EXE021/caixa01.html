<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{
            
            background-color: aqua;
            height: 250px;
            width: 250px;
            border: 10px solid darkcyan;

            padding: 10px 20px;

            margin: 20px auto 40px auto;

            outline: 5px dashed saddlebrown;
        }
        a{
            
            border-width: 10px;
            border-style: solid;
            border-color: rgb(60, 60, 209);
            padding: 10px 10px 10px 10px;
        }
    

    </style>
</head>
<body>
    <H1>Exemplo de caixas Block-level</H1>
    <p>Parafrafos também são exemplos de Block-level mas os <a href="#">links são exemplos de caixa inline-level</a>Vamos ver como tudo funciona</p>
</body>
</html>
