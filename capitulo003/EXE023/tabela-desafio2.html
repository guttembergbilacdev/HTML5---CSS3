<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body {
                font-family: Arial, Helvetica, sans-serif;
            
            }
            
            h1 {
                text-align: center;
                color: black;
            }

        table {
                border-collapse: collapse;
                width: 500px;
                
            }

        .media {
                text-align: center;
                background-color: rgba(0, 0, 0, 0.61);
                color: white;
                font-weight: bold;
            }

        caption {
                font-size: 20px;
                font-weight: ;
                margin: 10px;
                color: black;
                             
            }
        tr{
                border: #000 solid 1px;
                padding: auto;
                text-align: center;
            }

        td {
                border: 1px solid #000;
                padding: 10px;
                text-align: left;
               
            }

        th {
                border: 1px solid #000;
                padding: 10px;
                text-align: center;
                font-weight: bold;
                background-color: rgba(0, 0, 0, 0.61);
                color: white;
            }

    </style>

</head>
<body>

    </tr>
    <tr>

    </tr>
        <td>Fisica</td>

    </tr>
        <td>Quimica</td>

        <td> 0.0</td>
    </tr>
        <td>Biologia</td>
        <td> 0.0</td>

        <td> 0.0</td>
    </tr>
    <tr  class="media">
        <td colspan="4">Média de Exatas</td>

    </tr>
    <tr  class="media">
        <td colspan="4">Média de Humanas</td>
        <td> 0.0</td>
        
    </tr>
</table>

</body>
</html>
